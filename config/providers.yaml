# Page-universe registry (generic). Each provider is scored across up to FOUR
# functional page slots, defined by ROLE not by page title:
#   homepage / fund_product / about_philosophy / guidance_support
#
# - A slot may hold one OR several URLs (combined into one corpus for that slot).
# - Mark a slot `na: true` ONLY when the provider genuinely has no such page
#   type. N/A slots are removed from the coverage denominator (they do not
#   penalise the provider). The labeller asserts N/A; the engine never guesses.
# - Adding a NEW provider = add a block in the same shape. Nothing else changes.
#
# Run:  python src/report.py --live
#   (for JS-rendered sites, first: pip install playwright && playwright install chromium)
# The coverage gate auto-flags any URL that fails to fetch, so unverified URLs
# are safe to leave here: they surface as "attempted_failed", not silent zeros.

providers:

  baillie_gifford:
    label: Baillie Gifford
    type: asset_manager
    homepage:         [https://www.bailliegifford.com/en/uk/individual-investors/]
